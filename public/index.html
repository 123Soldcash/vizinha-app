<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vizinha - Villagio Bourbon</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background: #f7f9fc; color: #2d3748; min-height: 100vh; }
    
    :root { --teal: #4FB8B8; --teal-dark: #3a9a9a; --coral: #FF8C7A; --coral-dark: #e67565; }
    
    .app-header { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(79,184,184,0.3); }
    .header-container { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .header-logo { width: 48px; height: 48px; border-radius: 12px; background: white; padding: 4px; flex-shrink: 0; }
    .header-title-group { display: flex; flex-direction: column; }
    .header-title { font-size: 24px; font-weight: 800; margin: 0; line-height: 1.1; }
    .header-frase { font-family: 'Caveat', cursive; font-size: 18px; font-weight: 500; color: #fff5f3; margin-top: 2px; transform: rotate(-1deg); white-space: nowrap; }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
    .btn-admin { background: var(--coral); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-logout { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    
    .container { max-width: 600px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
    
    .search-box { background: white; border-radius: 24px; padding: 14px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .search-box input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; }
    
    .btn-cadastrar { background: var(--coral); color: white; border: none; padding: 14px; border-radius: 24px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(255,140,122,0.3); }
    
    .grupo-header { padding: 14px 18px; border-radius: 16px; color: white; font-weight: 700; font-size: 16px; margin: 14px 0 10px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .grupo-header .seta { transition: transform 0.3s; }
    .grupo-header.collapsed .seta { transform: rotate(-90deg); }
    
    .grupo-obras { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .grupo-saude { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .grupo-casa { background: linear-gradient(135deg, var(--teal), #5ec4c4); }
    .grupo-beleza { background: linear-gradient(135deg, #db2777, #ec4899); }
    .grupo-tech { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
    .grupo-pets { background: linear-gradient(135deg, #059669, #10b981); }
    .grupo-transporte { background: linear-gradient(135deg, #475569, #64748b); }
    .grupo-alimentacao { background: linear-gradient(135deg, #059669, #10b981); }
    .grupo-familia { background: linear-gradient(135deg, #475569, #64748b); }
    .grupo-outros { background: linear-gradient(135deg, #6b7280, #9ca3af); }
    
    .grupo-content { overflow: hidden; transition: max-height 0.3s ease-out; max-height: 2000px; }
    .grupo-content.collapsed { max-height: 0 !important; }
    
    .card-categoria { background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-left: 5px solid var(--teal); }
    .card-categoria .icone { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .card-categoria .info { flex: 1; }
    .card-categoria .nome { font-weight: 700; font-size: 15px; }
    .card-categoria .contador { font-size: 13px; color: #718096; }
    
    .card-prestador { background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-left: 5px solid var(--coral); }
    .card-prestador .info { flex: 1; }
    .card-prestador .nome { font-weight: 700; font-size: 15px; }
    .card-prestador .sub { font-size: 13px; color: #718096; }
    
    .btn-voltar { background: white; border: 2px solid #e2e8f0; padding: 8px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
    
    .card-detalhe { background: white; border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .btn-whats { background: #25d366; border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-ligar { background: var(--teal); border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-whats svg, .btn-ligar svg { width: 22px; height: 22px; fill: white; }
    
    .btn-primary { background: var(--teal); color: white; border: none; padding: 14px; border-radius: 20px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 12px; }
    .btn-secondary { background: var(--coral); color: white; border: none; padding: 12px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }
    
    .avaliacao-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .avaliacao-card { background: white; border: 3px solid #e2e8f0; border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .avaliacao-card.selected-indica { border-color: var(--teal); background: #f0fdfa; }
    .avaliacao-card.selected-nao { border-color: var(--coral); background: #fff5f3; }
    .avaliacao-emoji { font-size: 48px; margin-bottom: 8px; }
    .avaliacao-label { font-weight: 800; font-size: 14px; }
    
    .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip { padding: 8px 14px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    .chip.selected { background: var(--teal); color: white; border-color: var(--teal); }
    
    .input-field { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 14px; margin-bottom: 10px; outline: none; }
    .input-field:focus { border-color: var(--teal); }
    
    .hidden { display: none !important; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; padding: 6px 16px; cursor: pointer; color: #718096; font-size: 11px; }
    .nav-item.active { color: var(--teal); font-weight: 800; }
    .nav-item .nav-icon { font-size: 24px; margin-bottom: 2px; }
    
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .admin-tab { background: white; border: 2px solid #e2e8f0; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .admin-tab.active { background: var(--teal); color: white; border-color: var(--teal); }

    .preco-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .preco-item:last-child { border-bottom: none; }
    .preco-valor { font-weight: 800; color: var(--teal-dark); }
  </style>
</head>
<body>

<div id="screen-login" class="container" style="max-width: 400px; margin: 60px auto; text-align: center;">
  <img src="/logo.png" alt="Vizinha" style="width: 100px; height: 100px; border-radius: 20px; margin-bottom: 20px;">
  <h1 style="font-size: 42px; font-weight: 800; color: var(--teal); margin-bottom: 8px;">Vizinha</h1>
  <p style="font-family: 'Caveat', cursive; font-size: 26px; color: var(--coral); margin-bottom: 8px;">tá aí as minhas indicações!</p>
  <p style="color: #718096; margin-bottom: 30px;">Condomínio Villagio Bourbon</p>
  
  <div id="step-phone">
    <label style="display: block; text-align: left; font-weight: 700; margin-bottom: 6px;">Seu celular com DDD</label>
    <input type="tel" id="login-phone" class="input-field" placeholder="(44) 99999-9999" maxlength="15">
    <button onclick="requestSMS()" class="btn-primary">Enviar Código por SMS</button>
  </div>
  
  <div id="step-code" class="hidden">
    <label style="display: block; text-align: left; font-weight: 700; margin-bottom: 6px;">Código de 6 dígitos</label>
    <input type="text" id="login-code" class="input-field" style="text-align: center; font-size: 24px; letter-spacing: 8px;" maxlength="6" placeholder="000000">
    <button onclick="verifySMS()" class="btn-primary">Confirmar</button>
    <button onclick="backToPhone()" style="background: none; border: none; color: var(--teal); padding: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px;">Voltar</button>
  </div>
</div>

<div id="screen-app" class="hidden">
  <header class="app-header">
    <div class="header-container">
      <div class="header-left">
        <img src="/logo.png" alt="Vizinha" class="header-logo">
        <div class="header-title-group">
          <h1 class="header-title">Vizinha</h1>
          <div class="header-frase">tá aí as minhas indicações! 💕</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-admin" onclick="showTab('admin')" class="btn-admin hidden">Administrador</button>
        <button onclick="logout()" class="btn-logout">Sair</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="tab-home">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="busca-prestador" oninput="filtrarCategorias()" placeholder="Buscar pelo nome ou serviço">
      </div>
      <button onclick="abrirModalCadastro()" class="btn-cadastrar">+ Cadastrar prestador</button>
      <div id="lista-categorias"></div>
    </div>

    <div id="tab-lista-prestadores" class="hidden">
      <button onclick="voltarParaCategorias()" class="btn-voltar">← Serviços</button>
      <h2 id="titulo-categoria-atual" style="font-size: 18px; font-weight: 800; color: var(--teal); margin: 12px 0;"></h2>
      <div id="lista-prestadores-categoria"></div>
    </div>

    <div id="tab-detalhe-prestador" class="hidden">
      <button onclick="voltarParaLista()" class="btn-voltar">← Voltar</button>
      <div id="conteudo-detalhe"></div>
    </div>

    <div id="tab-avaliacoes" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Minhas Avaliações</h2>
      <div id="lista-minhas-avaliacoes"></div>
    </div>

    <div id="tab-precos" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Comparativo de Preços</h2>
      <select id="grafico-categoria-select" class="input-field" onchange="renderizarGraficoPrecos(this.value)">
        <option value="">Selecione uma categoria para comparar...</option>
      </select>
      <div class="card-detalhe" style="padding: 10px;">
        <canvas id="graficoPrecos"></canvas>
      </div>
      <div id="lista-precos-categoria"></div>
    </div>

    <div id="tab-perfil" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Meu Perfil</h2>
      <div id="perfil-info" class="card-detalhe"></div>
    </div>

    <div id="tab-admin" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Painel do Administrador</h2>
      <div class="admin-tabs">
        <button onclick="showAdminTab('moradores')" class="admin-tab active" id="admin-tab-moradores">Moradores</button>
        <button onclick="showAdminTab('categorias')" class="admin-tab" id="admin-tab-categorias">Categorias</button>
        <button onclick="showAdminTab('mensagens')" class="admin-tab" id="admin-tab-mensagens">Mensagens</button>
      </div>
      <div id="admin-moradores"></div>
      <div id="admin-categorias" class="hidden"></div>
      <div id="admin-mensagens" class="hidden"></div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="showTab('home')">
      <span class="nav-icon">🏠</span><span>Início</span>
    </div>
    <div class="nav-item" id="nav-precos" onclick="showTab('precos')">
      <span class="nav-icon">📊</span><span>Preços</span>
    </div>
    <div class="nav-item" id="nav-avaliacoes" onclick="showTab('avaliacoes')">
      <span class="nav-icon">⭐</span><span>Avaliações</span>
    </div>
    <div class="nav-item" id="nav-perfil" onclick="showTab('perfil')">
      <span class="nav-icon">👤</span><span>Perfil</span>
    </div>
  </nav>
</div>

<!-- MODAL CADASTRO COM WHATSAPP -->
<div id="modal-cadastro" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center;">
  <div style="background: white; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 20px; font-weight: 800;">Novo Prestador</h3>
      <button onclick="fecharModalCadastro()" style="background: none; border: none; font-size: 24px; cursor: pointer;">✕</button>
    </div>
    
    <div style="background: #f0fdfa; padding: 16px; border-radius: 16px; margin-bottom: 16px; border: 2px dashed var(--teal);">
      <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--teal-dark);">📋 Cole a mensagem do WhatsApp aqui:</label>
      <textarea id="whatsapp-paste" class="input-field" style="background: white; min-height: 60px;" placeholder="Ex: O João eletricista é ótimo, tel: (44) 99999-1234"></textarea>
      <button onclick="extrairDadosWhatsApp()" class="btn-secondary" style="margin-top: 8px;">✨ Extrair Dados Automaticamente</button>
    </div>
    
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Nome *</label>
    <input type="text" id="cad-nome" class="input-field" placeholder="Nome do prestador">
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Telefone *</label>
    <input type="tel" id="cad-telefone" class="input-field" placeholder="(44) 99999-9999">
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Tipo *</label>
    <select id="cad-tipo" class="input-field">
      <option value="Autônomo">Autônomo</option>
      <option value="Empresa">Empresa</option>
    </select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Categoria *</label>
    <select id="cad-categoria" class="input-field"><option value="">Selecione...</option></select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Diferencial</label>
    <textarea id="cad-diferencial" class="input-field" placeholder="Ex: 10 anos de experiência"></textarea>
    <button onclick="salvarPrestador()" class="btn-primary">Salvar Prestador</button>
  </div>
</div>

<script>
let token = localStorage.getItem('vizinha_token');
let categorias = [];
let prestadores = [];
let resumoAvaliacoes = {};
let ehAdmin = false;
let gruposAbertos = {};
let categoriaAtualId = null;
let categoriaAtualNome = null;
let prestadorAtual = null;
let tipoAvaliacao = null;
let chartInstance = null;

const iconesCategorias = {
  'Diarista': '🧹', 'Mensalista': '👷', 'Babá': '👶', 'Cuidador de idoso': '👴',
  'Lavanderia': '👕', 'Manicure': '💅', 'Terapia': '🧠', 'Médicos': '🩺',
  'Organização': '📦', 'Pintor': '🎨', 'Eletricista': '💡', 'Encanador': '🔧',
  'Azulejista': '🟦', 'Marceneiro': '🪚', 'Jardineiro': '🌿', 'Ar-condicionado': '❄️',
  'Eletrodomésticos': '🔌', 'Dedetizador': '🪳', 'Gesseiro': '🏗️', 'Pedreiro': '🧱',
  'Coleta de exames': '🩸', 'Enfermeiro': '💉', 'Fisioterapeuta': '🦴',
  'Cabeleireiro': '💇', 'Maquiador': '💄', 'Massagista': '💆',
  'Geladeira': '🧊', 'Internet': '🌐', 'Máquina de lavar': '🫧', 'TV a cabo': '📺',
  'Água': '🚰', 'Delivery de comida': '🛵', 'Gás': '🔥', 'Minimercado': '🛒',
  'Caixa de gordura': '🍳', 'Cozinheira': '🥘', 'Deep cleaning': '✨',
  'Limpeza de caixa d\'água': '💧', 'Limpeza de vidros': '🪟', 'Passadeira': '👕',
  'Lava car': '🚗', 'Piscineiro': '🏊', 'Outra': '➕'
};

function getIcone(cat) { return iconesCategorias[cat] || '🔧'; }
function getCorGrupo(grupo) {
  const cores = { 'Casa e Limpeza': '#4FB8B8', 'Obras e Reformas': '#d97706', 'Assistência Técnica e Instalações': '#7c3aed', 'Saúde e Home Care': '#dc2626', 'Beleza e Bem-Estar': '#db2777', 'Família e Área Externa': '#475569', 'Alimentação e Entregas': '#059669', 'Outros': '#6b7280' };
  return cores[grupo] || '#6b7280';
}
function getClasseGrupo(grupo) {
  const classes = { 'Casa e Limpeza': 'grupo-casa', 'Obras e Reformas': 'grupo-obras', 'Assistência Técnica e Instalações': 'grupo-tech', 'Saúde e Home Care': 'grupo-saude', 'Beleza e Bem-Estar': 'grupo-beleza', 'Família e Área Externa': 'grupo-familia', 'Alimentação e Entregas': 'grupo-alimentacao', 'Outros': 'grupo-outros' };
  return classes[grupo] || 'grupo-outros';
}

async function requestSMS() {
  const phone = document.getElementById('login-phone').value;
  const res = await fetch('/api/login/request', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({telefone: phone}) });
  const data = await res.json();
  if (res.ok) {
    document.getElementById('step-phone').classList.add('hidden');
    document.getElementById('step-code').classList.remove('hidden');
  } else { alert(data.error); }
}

async function verifySMS() {
  const phone = document.getElementById('login-phone').value;
  const code = document.getElementById('login-code').value;
  const res = await fetch('/api/login/verify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({telefone: phone, codigo: code}) });
  const data = await res.json();
  if (res.ok) {
    token = data.token; ehAdmin = data.eh_admin;
    localStorage.setItem('vizinha_token', token);
    localStorage.setItem('vizinha_admin', ehAdmin ? '1' : '0');
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-app').classList.remove('hidden');
    if (ehAdmin) document.getElementById('btn-admin').classList.remove('hidden');
    await initApp();
  } else { alert(data.error); }
}

function backToPhone() {
  document.getElementById('step-code').classList.add('hidden');
  document.getElementById('step-phone').classList.remove('hidden');
}

function logout() {
  localStorage.removeItem('vizinha_token');
  localStorage.removeItem('vizinha_admin');
  location.reload();
}

async function initApp() {
  await carregarCategorias();
  await carregarPrestadores();
  await carregarResumoAvaliacoes();
  renderizarCategorias();
  preencherSelectGrafico();
}

async function carregarCategorias() {
  const res = await fetch('/api/categorias', { headers: {'Authorization': `Bearer ${token}`} });
  categorias = await res.json();
  const select = document.getElementById('cad-categoria');
  select.innerHTML = '<option value="">Selecione...</option>';
  categorias.forEach(c => { select.innerHTML += `<option value="${c.id}">${c.nome} (${c.grupo})</option>`; });
}

async function carregarPrestadores() {
  const res = await fetch('/api/prestadores', { headers: {'Authorization': `Bearer ${token}`} });
  prestadores = await res.json();
}

async function carregarResumoAvaliacoes() {
  try {
    const res = await fetch('/api/prestadores/avaliacoes-resumo', { headers: {'Authorization': `Bearer ${token}`} });
    const data = await res.json();
    resumoAvaliacoes = {};
    data.forEach(r => { resumoAvaliacoes[r.prestador_id] = { indica: parseInt(r.indica) || 0, nao_indica: parseInt(r.nao_indica) || 0 }; });
  } catch(e) { resumoAvaliacoes = {}; }
}

function toggleGrupo(grupo) {
  gruposAbertos[grupo] = !gruposAbertos[grupo];
  renderizarCategorias();
}

function renderizarCategorias() {
  const busca = document.getElementById('busca-prestador').value.toLowerCase().trim();
  const container = document.getElementById('lista-categorias');
  container.innerHTML = '';
  const grupos = {};
  categorias.forEach(c => { if (!grupos[c.grupo]) grupos[c.grupo] = []; grupos[c.grupo].push(c); });
  const ordemGrupos = ['Obras e Reformas','Saúde e Home Care','Beleza e Bem-Estar','Assistência Técnica e Instalações','Alimentação e Entregas','Casa e Limpeza','Família e Área Externa','Outros'];
  
  ordemGrupos.forEach(grupo => {
    if (!grupos[grupo]) return;
    const cats = grupos[grupo].filter(c => {
      if (!busca) return true;
      const matchCategoria = c.nome.toLowerCase().includes(busca);
      const prestadoresMatch = prestadores.filter(p => p.categoria_principal_id === c.id && p.nome.toLowerCase().includes(busca));
      return matchCategoria || prestadoresMatch.length > 0;
    });
    if (cats.length === 0) return;
    const estaAberto = gruposAbertos[grupo] === true || busca.length > 0;
    
    const grupoDiv = document.createElement('div');
    grupoDiv.innerHTML = `
      <div class="grupo-header ${getClasseGrupo(grupo)} ${!estaAberto ? 'collapsed' : ''}" onclick="toggleGrupo('${grupo}')">
        <span>${grupo}</span><span class="seta">▼</span>
      </div>
      <div class="grupo-content ${!estaAberto ? 'collapsed' : ''}">
        ${cats.map(c => {
          const count = prestadores.filter(p => p.categoria_principal_id === c.id).length;
          return `<div class="card-categoria" style="border-left-color:${getCorGrupo(grupo)};" onclick="abrirCategoria(${c.id}, '${c.nome.replace(/'/g,"\\'")}')">
            <div class="icone" style="background:${getCorGrupo(grupo)}20; color:${getCorGrupo(grupo)};">${getIcone(c.nome)}</div>
            <div class="info"><div class="nome">${c.nome}</div><div class="contador">${count} prestador(es)</div></div>
            <span style="color: #cbd5e0; font-size: 20px;">›</span>
          </div>`;
        }).join('')}
      </div>`;
    container.appendChild(grupoDiv);
  });
}

function abrirCategoria(catId, catNome) {
  categoriaAtualId = catId; categoriaAtualNome = catNome;
  document.getElementById('titulo-categoria-atual').textContent = catNome;
  const lista = document.getElementById('lista-prestadores-categoria');
  const catsPrest = prestadores.filter(p => p.categoria_principal_id === catId);
  
  if (catsPrest.length === 0) {
    lista.innerHTML = '<div class="card-detalhe" style="text-align: center; color: #718096; padding: 30px;">Nenhum prestador nesta categoria ainda.</div>';
  } else {
    lista.innerHTML = catsPrest.map(p => {
      const resumo = resumoAvaliacoes[p.id] || {indica:0, nao_indica:0};
      const total = resumo.indica + resumo.nao_indica;
      const statusAval = total === 0 ? 'sem avaliação' : `${resumo.indica} indica / ${resumo.nao_indica} não`;
      return `<div class="card-prestador" onclick="abrirDetalhe(${p.id})">
        <div class="info"><div class="nome">${p.nome}</div><div class="sub">${p.tipo} · ${p.categoria_nome}</div></div>

    }).join('');
  }
  showTab('lista-prestadores');
}

function selecionarAvaliacao(tipo) {
  tipoAvaliacao = tipo;
  document.getElementById('btn-indica').classList.toggle('selected-indica', tipo === 'indica');
  document.getElementById('btn-nao-indica').classList.toggle('selected-nao', tipo === 'nao_indica');
  document.getElementById('secao-motivos').classList.toggle('hidden', tipo !== 'indica');
  document.getElementById('secao-comentario').classList.toggle('hidden', tipo !== 'indica');
}
function toggleChip(el) { el.classList.toggle('selected'); }

async function enviarAvaliacao() {
  if (!tipoAvaliacao) { alert('Selecione INDICA ou NÃO INDICA'); return; }
  const motivos = [];
  document.querySelectorAll('#secao-motivos .chip.selected').forEach(c => motivos.push(c.textContent));
  const comentario = document.getElementById('comentario')?.value || '';
  const res = await fetch('/api/avaliacoes', {
    method: 'POST', headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
    body: JSON.stringify({ prestador_id: prestadorAtual.id, tipo: tipoAvaliacao, motivos: motivos, comentario: comentario })
  });
  if (res.ok) {
    alert('Avaliação enviada com sucesso!');
    await carregarResumoAvaliacoes();
    abrirDetalhe(prestadorAtual.id);
  } else { alert('Erro: ' + (await res.json()).error); }
}

function voltarParaLista() {

  else showTab('home');

function showTab(tab) {
  ['home','lista-prestadores','detalhe-prestador','avaliacoes','precos','perfil','admin'].forEach(t => {
    const el = document.getElementById('tab-'+t); if (el) el.classList.add('hidden');
  });
  document.getElementById('tab-'+tab).classList.remove('hidden');
  ['home','precos','avaliacoes','perfil'].forEach(t => {
    const nav = document.getElementById('nav-'+t); if (nav) nav.classList.remove('active');
  });
  const activeNav = document.getElementById('nav-'+tab);
  if (activeNav) activeNav.classList.add('active');
  document.getElementById('bottom-nav').classList.toggle('hidden', tab === 'admin' || tab === 'lista-prestadores' || tab === 'detalhe-prestador');
  
  if (tab === 'avaliacoes') carregarMinhasAvaliacoes();
  if (tab === 'perfil') carregarPerfil();
  if (tab === 'admin') { carregarMoradores(); carregarCategoriasAdmin(); carregarMensagens(); }
  if (tab === 'precos') preencherSelectGrafico();
}

function showAdminTab(tab) {
  ['moradores','categorias','mensagens'].forEach(t => {
    document.getElementById('admin-'+t).classList.add('hidden');
    document.getElementById('admin-tab-'+t).classList.remove('active');
  });
  document.getElementById('admin-'+tab).classList.remove('hidden');
  document.getElementById('admin-tab-'+tab).classList.add('active');
}

function abrirModalCadastro() { document.getElementById('modal-cadastro').classList.remove('hidden'); }
function fecharModalCadastro() { document.getElementById('modal-cadastro').classList.add('hidden'); }

async function salvarPrestador() {
  const nome = document.getElementById('cad-nome').value.trim();
  const telefone = document.getElementById('cad-telefone').value.trim();
  const tipo = document.getElementById('cad-tipo').value;
  const categoria_id = document.getElementById('cad-categoria').value;
  const diferencial = document.getElementById('cad-diferencial').value.trim();
  if (!nome || !telefone || !categoria_id) { alert('Preencha nome, telefone e categoria'); return; }
  
  const res = await fetch('/api/prestadores', {
    method: 'POST', headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
    body: JSON.stringify({ nome, telefone, tipo, categoria_id, diferencial })
  });
  if (res.ok) {
    alert('Prestador cadastrado!');
    fecharModalCadastro();
    await carregarPrestadores();
    renderizarCategorias();
  } else { alert('Erro: ' + (await res.json()).error); }
}

// --- FUNÇÕES DE PREÇOS E GRÁFICO ---
async function salvarPrecoPrestador(prestadorId) {
  let tipo_preco = document.getElementById('preco-tipo').value.trim();
  const valor = document.getElementById('preco-valor').value;
  
  // Se escolheu "Outros", usa o valor digitado no campo personalizado
  if (tipo_preco === 'Outros') {
    tipo_preco = document.getElementById('preco-tipo-outros').value.trim();
    if (!tipo_preco) { alert('Digite o tipo personalizado'); return; }
  }
  
  if (!valor) { alert('Preencha o valor'); return; }

  const res = await fetch(`/api/prestadores/${prestadorId}/precos`, {
    method: 'POST', headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
    body: JSON.stringify({ tipo_preco, valor, data_referencia: new Date().toISOString().split('T')[0] })
  });
  
  if (res.ok) {
    alert('Preço adicionado!');
    abrirDetalhe(prestadorId);
  } else {
    alert('Erro ao salvar preço');
  }
}

// Mostra/esconde o campo "Outros" no formulário de preço
function toggleOutrosPreco() {
  const select = document.getElementById('preco-tipo');
  const campoOutros = document.getElementById('preco-tipo-outros');
  if (select.value === 'Outros') {
    campoOutros.classList.remove('hidden');
    campoOutros.focus();
  } else {
    campoOutros.classList.add('hidden');
    campoOutros.value = '';
  }
}

function preencherSelectGrafico() {
  const select = document.getElementById('grafico-categoria-select');

  categorias.forEach(c => {
    select.innerHTML += `<option value="${c.id}">${c.nome}</option>`;

async function renderizarGraficoPrecos(categoriaId) {
  if (!categoriaId) return;
  
  const res = await fetch(`/api/categorias/${categoriaId}/precos`, { headers: {'Authorization': `Bearer ${token}`} });
  const dados = await res.json();
  
  const listaDiv = document.getElementById('lista-precos-categoria');
  if (dados.length === 0) {
    listaDiv.innerHTML = '<p style="text-align:center; color:#718096; margin-top:20px;">Nenhum preço registrado nesta categoria ainda.</p>';
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    return;
  }

  const tiposUnicos = [...new Set(dados.map(d => d.tipo_preco))];
  const labels = tiposUnicos;
  const dataValues = tiposUnicos.map(tipo => {
    const itens = dados.filter(d => d.tipo_preco === tipo);
    const soma = itens.reduce((acc, curr) => acc + parseFloat(curr.valor || 0), 0);
    return (soma / itens.length).toFixed(2);
  });

  const ctx = document.getElementById('graficoPrecos').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Preço Médio (R$)',
        data: dataValues,
        backgroundColor: 'rgba(79, 184, 184, 0.6)',
        borderColor: 'rgba(79, 184, 184, 1)',
        borderWidth: 1,
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true } }
    }
  });

  listaDiv.innerHTML = '<h4 style="margin: 20px 0 10px 0; font-weight:700;">Detalhamento:</h4>' + 
    dados.map(d => `
      <div class="card-detalhe" style="padding: 12px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:700;">${d.prestador_nome}</div>
          <div style="font-size:12px; color:#718096;">${d.tipo_preco} · Ref: ${new Date(d.data_referencia).toLocaleDateString('pt-BR')}</div>
        </div>
        <div style="font-weight:800; color:var(--teal-dark); font-size:18px;">R$ ${parseFloat(d.valor).toFixed(2)}</div>
      </div>
    `).join('');
}

// --- FUNÇÃO MÁGICA: EXTRAIR DADOS DO WHATSAPP ---
function extrairDadosWhatsApp() {
  const texto = document.getElementById('whatsapp-paste').value;
  if (!texto.trim()) {
    alert('Por favor, cole a mensagem do WhatsApp primeiro.');
    return;
  }

  const matchTelefone = texto.match(/\(?\d{2}\)?\s?\d{4,5}-?\s?\d{4}/);
  if (matchTelefone) {
    let telefoneLimpo = matchTelefone[0].replace(/\D/g, '');
    if (telefoneLimpo.length === 11) {
      telefoneLimpo = `(${telefoneLimpo.slice(0,2)}) ${telefoneLimpo.slice(2,7)}-${telefoneLimpo.slice(7)}`;
    } else if (telefoneLimpo.length === 10) {
      telefoneLimpo = `(${telefoneLimpo.slice(0,2)}) ${telefoneLimpo.slice(2,6)}-${telefoneLimpo.slice(6)}`;
    }
    document.getElementById('cad-telefone').value = telefoneLimpo;
  }

  let categoriaEncontrada = null;
  const textoLower = texto.toLowerCase();
  const palavrasChave = {
    'Eletricista': ['eletricista', 'luz', 'fio', 'tomada'],
    'Encanador': ['encanador', 'cano', 'vazamento', 'pia'],
    'Pintor': ['pintor', 'pintura', 'parede'],
    'Diarista': ['diarista', 'faxina', 'limpeza', 'empregada'],
    'Ar-condicionado': ['ar condicionado', 'ar-condicionado', 'climatização'],
    'Jardineiro': ['jardineiro', 'jardim', 'grama', 'poda'],
    'Marceneiro': ['marceneiro', 'móvel', 'madeira'],
    'Dedetizador': ['dedetização', 'dedetizador', 'inseto', 'praga']
  };

  for (const [categoria, palavras] of Object.entries(palavrasChave)) {
    if (palavras.some(palavra => textoLower.includes(palavra))) {
      categoriaEncontrada = categoria;
      break;
    }
  }

  if (categoriaEncontrada) {
    const select = document.getElementById('cad-categoria');
    for (let i = 0; i < select.options.length; i++) {
      if (select.options[i].text.toLowerCase().includes(categoriaEncontrada.toLowerCase())) {
        select.selectedIndex = i;
        break;
      }
    }
  }

  let textoSemTelefone = texto.replace(matchTelefone ? matchTelefone[0] : '', '');
  let textoLimpo = textoSemTelefone.replace(/indicado|recomendo|contato|tel|telefone|whatsapp|zap|ótimo|otimo|bom|boa/gi, '').trim();
  const possiveisNomes = textoLimpo.split(/[,;.]/)[0].trim().split(' ').slice(0, 3).join(' ');
  if (possiveisNomes.length > 2) {
    document.getElementById('cad-nome').value = possiveisNomes.charAt(0).toUpperCase() + possiveisNomes.slice(1);
  }

  alert('✨ Dados extraídos! Verifique se o nome e a categoria estão corretos.');
}
function formatarTelefone(telefone) {
  // Remove tudo que não é número
  let numeros = telefone.replace(/\D/g, '');
  
  // Se começa com 55 e tem mais de 11 dígitos, remove o 55 do início
  if (numeros.startsWith('55') && numeros.length > 11) {
    numeros = numeros.slice(2);
  }
  
  // Formata: (44) 99999-9999
  if (numeros.length === 11) {
    return `(${numeros.slice(0,2)}) ${numeros.slice(2,7)}-${numeros.slice(7)}`;
  } else if (numeros.length === 10) {
    return `(${numeros.slice(0,2)}) ${numeros.slice(2,6)}-${numeros.slice(6)}`;
  }
  
  return telefone; // Retorna original se não conseguir formatar
}
