<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vizinha - Villagio Bourbon</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background: #f7f9fc; color: #2d3748; min-height: 100vh; }
    :root { --teal: #4FB8B8; --teal-dark: #3a9a9a; --coral: #FF8C7A; --coral-dark: #e67565; }
    .app-header { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(79,184,184,0.3); }
    .header-container { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .header-logo { width: 48px; height: 48px; border-radius: 12px; background: white; padding: 4px; flex-shrink: 0; }
    .header-title-group { display: flex; flex-direction: column; }
    .header-title { font-size: 24px; font-weight: 800; margin: 0; line-height: 1.1; }
    .header-frase { font-family: 'Caveat', cursive; font-size: 18px; font-weight: 500; color: #fff5f3; margin-top: 2px; transform: rotate(-1deg); white-space: nowrap; }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
    .btn-admin { background: var(--coral); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-logout { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
    .search-box { background: white; border-radius: 24px; padding: 14px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .search-box input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; }
    .btn-cadastrar { background: var(--coral); color: white; border: none; padding: 14px; border-radius: 24px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(255,140,122,0.3); }
    .grupo-header { padding: 14px 18px; border-radius: 16px; color: white; font-weight: 700; font-size: 16px; margin: 14px 0 10px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .grupo-header .seta { transition: transform 0.3s; }
    .grupo-header.collapsed .seta { transform: rotate(-90deg); }
    .grupo-obras { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .grupo-saude { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .grupo-casa { background: linear-gradient(135deg, var(--teal), #5ec4c4); }
    .grupo-beleza { background: linear-gradient(135deg, #db2777, #ec4899); }
    .grupo-tech { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
    .grupo-pets { background: linear-gradient(135deg, #059669, #10b981); }
    .grupo-alimentacao { background: linear-gradient(135deg, #059669, #10b981); }
    .grupo-familia { background: linear-gradient(135deg, #475569, #64748b); }
    .grupo-outros { background: linear-gradient(135deg, #6b7280, #9ca3af); }
    .grupo-content { overflow: hidden; transition: max-height 0.3s ease-out; max-height: 2000px; }
    .grupo-content.collapsed { max-height: 0 !important; }
    .card-categoria { background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-left: 5px solid var(--teal); }
    .card-categoria .icone { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .card-categoria .info { flex: 1; }
    .card-categoria .nome { font-weight: 700; font-size: 15px; }
    .card-categoria .contador { font-size: 13px; color: #718096; }
    .card-prestador { background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-left: 5px solid var(--coral); }
    .card-prestador .info { flex: 1; }
    .card-prestador .nome { font-weight: 700; font-size: 15px; }
    .card-prestador .sub { font-size: 13px; color: #718096; }
    .btn-voltar { background: white; border: 2px solid #e2e8f0; padding: 8px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
    .card-detalhe { background: white; border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .btn-whats { background: #25d366; border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-ligar { background: var(--teal); border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-editar { background: #f59e0b; border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; flex-shrink: 0; }
    .btn-whats svg, .btn-ligar svg { width: 22px; height: 22px; fill: white; }
    .btn-primary { background: var(--teal); color: white; border: none; padding: 14px; border-radius: 20px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 12px; }
    .btn-secondary { background: var(--coral); color: white; border: none; padding: 12px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }
    .avaliacao-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .avaliacao-card { background: white; border: 3px solid #e2e8f0; border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .avaliacao-card.selected-indica { border-color: var(--teal); background: #f0fdfa; }
    .avaliacao-card.selected-nao { border-color: var(--coral); background: #fff5f3; }
    .avaliacao-emoji { font-size: 48px; margin-bottom: 8px; }
    .avaliacao-label { font-weight: 800; font-size: 14px; }
    .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip { padding: 8px 14px; border-radius: 20px; border: 2px solid #e2e8f0; background: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    .chip.selected { background: var(--teal); color: white; border-color: var(--teal); }
    .input-field { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 14px; margin-bottom: 10px; outline: none; }
    .input-field:focus { border-color: var(--teal); }
    .hidden { display: none !important; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; padding: 6px 16px; cursor: pointer; color: #718096; font-size: 11px; }
    .nav-item.active { color: var(--teal); font-weight: 800; }
    .nav-item .nav-icon { font-size: 24px; margin-bottom: 2px; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .admin-tab { background: white; border: 2px solid #e2e8f0; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .admin-tab.active { background: var(--teal); color: white; border-color: var(--teal); }
    .preco-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .preco-item:last-child { border-bottom: none; }
    .preco-valor { font-weight: 800; color: var(--teal-dark); font-size: 16px; }
    .preco-acoes { display: flex; gap: 8px; }
    .btn-acao { background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px; }
    .aviso-saude { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 13px; color: #92400e; }
  </style>
</head>
<body>

<div id="screen-login" class="container" style="max-width: 400px; margin: 60px auto; text-align: center;">
  <img src="/logo.png" alt="Vizinha" style="width: 100px; height: 100px; border-radius: 20px; margin-bottom: 20px;">
  <h1 style="font-size: 42px; font-weight: 800; color: var(--teal); margin-bottom: 8px;">Vizinha</h1>
  <p style="font-family: 'Caveat', cursive; font-size: 26px; color: var(--coral); margin-bottom: 8px;">tá aí as minhas indicações!</p>
  <p style="color: #718096; margin-bottom: 30px;">Condomínio Villagio Bourbon</p>
  <div id="step-phone">
    <label style="display: block; text-align: left; font-weight: 700; margin-bottom: 6px;">Seu celular com DDD</label>
    <input type="tel" id="login-phone" class="input-field" placeholder="(44) 99999-9999" maxlength="15">
    <button onclick="requestSMS()" class="btn-primary">Enviar Código por SMS</button>
  </div>
  <div id="step-code" class="hidden">
    <label style="display: block; text-align: left; font-weight: 700; margin-bottom: 6px;">Código de 6 dígitos</label>
    <input type="text" id="login-code" class="input-field" style="text-align: center; font-size: 24px; letter-spacing: 8px;" maxlength="6" placeholder="000000">
    <button onclick="verifySMS()" class="btn-primary">Confirmar</button>
    <button onclick="backToPhone()" style="background: none; border: none; color: var(--teal); padding: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px;">Voltar</button>
  </div>
</div>

<div id="screen-app" class="hidden">
  <header class="app-header">
    <div class="header-container">
      <div class="header-left">
        <img src="/logo.png" alt="Vizinha" class="header-logo">
        <div class="header-title-group">
          <h1 class="header-title">Vizinha</h1>
          <div class="header-frase">tá aí as minhas indicações! 💕</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-admin" onclick="showTab('admin')" class="btn-admin hidden">Administrador</button>
        <button onclick="logout()" class="btn-logout">Sair</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="tab-home">
      <div class="search-box"><span>🔍</span><input type="text" id="busca-prestador" oninput="filtrarCategorias()" placeholder="Buscar pelo nome ou serviço"></div>
      <button onclick="abrirModalCadastro()" class="btn-cadastrar">+ Cadastrar prestador</button>
      <div id="lista-categorias"></div>
    </div>
    <div id="tab-lista-prestadores" class="hidden">
      <button onclick="voltarParaCategorias()" class="btn-voltar">← Serviços</button>
      <h2 id="titulo-categoria-atual" style="font-size: 18px; font-weight: 800; color: var(--teal); margin: 12px 0;"></h2>
      <div id="lista-prestadores-categoria"></div>
    </div>
    <div id="tab-detalhe-prestador" class="hidden">
      <button onclick="voltarParaLista()" class="btn-voltar">← Voltar</button>
      <div id="conteudo-detalhe"></div>
    </div>
    <div id="tab-avaliacoes" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Minhas Avaliações</h2>
      <div id="lista-minhas-avaliacoes"></div>
    </div>
    <div id="tab-precos" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Comparativo de Preços</h2>
      <select id="grafico-categoria-select" class="input-field" onchange="renderizarGraficoPrecos(this.value)"><option value="">Selecione uma categoria para comparar...</option></select>
      <div class="card-detalhe" style="padding: 10px;"><canvas id="graficoPrecos"></canvas></div>
      <div id="lista-precos-categoria"></div>
    </div>
    <div id="tab-perfil" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Meu Perfil</h2>
      <div id="perfil-info" class="card-detalhe"></div>
    </div>
    <div id="tab-admin" class="hidden">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--teal);">Painel do Administrador</h2>
      <div class="admin-tabs">
        <button onclick="showAdminTab('moradores')" class="admin-tab active" id="admin-tab-moradores">Moradores</button>
        <button onclick="showAdminTab('categorias')" class="admin-tab" id="admin-tab-categorias">Categorias</button>
        <button onclick="showAdminTab('mensagens')" class="admin-tab" id="admin-tab-mensagens">Mensagens</button>
      </div>
      <div id="admin-moradores"></div><div id="admin-categorias" class="hidden"></div><div id="admin-mensagens" class="hidden"></div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="showTab('home')"><span class="nav-icon">🏠</span><span>Início</span></div>
    <div class="nav-item" id="nav-precos" onclick="showTab('precos')"><span class="nav-icon">📊</span><span>Preços</span></div>
    <div class="nav-item" id="nav-avaliacoes" onclick="showTab('avaliacoes')"><span class="nav-icon">⭐</span><span>Avaliações</span></div>
    <div class="nav-item" id="nav-perfil" onclick="showTab('perfil')"><span class="nav-icon">👤</span><span>Perfil</span></div>
  </nav>
</div>

<!-- MODAL CADASTRO -->
<div id="modal-cadastro" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center;">
  <div style="background: white; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 20px; font-weight: 800;">Novo Prestador</h3>
      <button onclick="fecharModalCadastro()" style="background: none; border: none; font-size: 24px; cursor: pointer;">✕</button>
    </div>
    <div style="background: #f0fdfa; padding: 16px; border-radius: 16px; margin-bottom: 16px; border: 2px dashed var(--teal);">
      <label style="display: block; font-weight: 700; margin-bottom: 6px; color: var(--teal-dark);">📋 Cole a mensagem do WhatsApp aqui:</label>
      <textarea id="whatsapp-paste" class="input-field" style="background: white; min-height: 60px;" placeholder="Ex: O João eletricista é ótimo, tel: (44) 99999-1234"></textarea>
      <button onclick="extrairDadosWhatsApp()" class="btn-secondary" style="margin-top: 8px;">✨ Extrair Dados Automaticamente</button>
    </div>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Nome *</label><input type="text" id="cad-nome" class="input-field" placeholder="Nome do prestador">
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Telefone *</label><input type="tel" id="cad-telefone" class="input-field" placeholder="(44) 99999-9999">
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Tipo *</label>
    <select id="cad-tipo" class="input-field">
      <option value="Morador">Morador</option>
      <option value="Autônomo">Autônomo</option>
      <option value="Empresa">Empresa</option>
    </select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Categoria *</label><select id="cad-categoria" class="input-field"><option value="">Selecione...</option></select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Diferencial</label><textarea id="cad-diferencial" class="input-field" placeholder="Ex: 10 anos de experiência"></textarea>
    <button onclick="salvarPrestador()" class="btn-primary">Salvar Prestador</button>
  </div>
</div>

<!-- MODAL EDIÇÃO PRESTADOR -->
<div id="modal-edicao" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center;">
  <div style="background: white; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 20px; font-weight: 800;">Editar Prestador</h3>
      <button onclick="fecharModalEdicao()" style="background: none; border: none; font-size: 24px; cursor: pointer;">✕</button>
    </div>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Nome *</label><input type="text" id="edit-nome" class="input-field">
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Telefone *</label><input type="tel" id="edit-telefone" class="input-field">
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Tipo *</label>
    <select id="edit-tipo" class="input-field">
      <option value="Morador">Morador</option>
      <option value="Autônomo">Autônomo</option>
      <option value="Empresa">Empresa</option>
    </select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Categoria *</label><select id="edit-categoria" class="input-field"><option value="">Selecione...</option></select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Diferencial</label><textarea id="edit-diferencial" class="input-field"></textarea>
    <button onclick="salvarEdicaoPrestador()" class="btn-primary">Salvar Alterações</button>
  </div>
</div>

<!-- MODAL EDIÇÃO PREÇO -->
<div id="modal-edicao-preco" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center;">
  <div style="background: white; width: 90%; max-width: 400px; border-radius: 24px; padding: 24px;">
    <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 16px;">Editar Preço</h3>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Tipo</label>
    <select id="edit-preco-tipo" class="input-field">
      <option value="Diária">Diária</option><option value="Por Hora">Por Hora</option><option value="Mensal">Mensal</option>
      <option value="Por Visita">Por Visita</option><option value="Por Serviço">Por Serviço</option><option value="Outros">Outros</option>
    </select>
    <label style="display: block; font-weight: 700; margin-bottom: 6px;">Valor (R$)</label>
    <input type="number" id="edit-preco-valor" class="input-field" step="0.01">
    <div style="display: flex; gap: 10px; margin-top: 16px;">
      <button onclick="fecharModalEdicaoPreco()" style="flex: 1; background: #e2e8f0; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">Cancelar</button>
      <button onclick="confirmarEdicaoPreco()" style="flex: 1; background: var(--teal); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">Salvar</button>
    </div>
  </div>
</div>

async function requestSMS() {
  const phone = document.getElementById('login-phone').value;
  const res = await fetch('/api/login/request', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({telefone: phone}) });
  if (res.ok) { document.getElementById('step-phone').classList.add('hidden'); document.getElementById('step-code').classList.remove('hidden'); } else { alert((await res.json()).error); }
}

async function verifySMS() {
  const phone = document.getElementById('login-phone').value;
  const code = document.getElementById('login-code').value;
  const res = await fetch('/api/login/verify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({telefone: phone, codigo: code}) });
  const data = await res.json();
  if (res.ok) {
    token = data.token; ehAdmin = data.eh_admin;
    user = { id: data.id, telefone: data.telefone, eh_admin: data.eh_admin };
    localStorage.setItem('vizinha_token', token);
    localStorage.setItem('vizinha_admin', ehAdmin ? '1' : '0');
    localStorage.setItem('vizinha_user', JSON.stringify(user));
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-app').classList.remove('hidden');
    if (ehAdmin) document.getElementById('btn-admin').classList.remove('hidden');
    await initApp();
  } else { alert(data.error); }
}

function backToPhone() { document.getElementById('step-code').classList.add('hidden'); document.getElementById('step-phone').classList.remove('hidden'); }
function logout() { localStorage.clear(); location.reload(); }

async function initApp() { await carregarCategorias(); await carregarPrestadores(); await carregarResumoAvaliacoes(); renderizarCategorias(); preencherSelectGrafico(); }
async function carregarCategorias() { const res = await fetch('/api/categorias', { headers: {'Authorization': `Bearer ${token}`} }); categorias = await res.json(); const s = document.getElementById('cad-categoria'); s.innerHTML = '<option value="">Selecione...</option>'; categorias.forEach(c => s.innerHTML += `<option value="${c.id}">${c.nome} (${c.grupo})</option>`); }
async function carregarPrestadores() { const res = await fetch('/api/prestadores', { headers: {'Authorization': `Bearer ${token}`} }); prestadores = await res.json(); }
async function carregarResumoAvaliacoes() { try { const res = await fetch('/api/prestadores/avaliacoes-resumo', { headers: {'Authorization': `Bearer ${token}`} }); const d = await res.json(); resumoAvaliacoes = {}; d.forEach(r => resumoAvaliacoes[r.prestador_id] = { indica: parseInt(r.indica)||0, nao_indica: parseInt(r.nao_indica)||0 }); } catch(e){} }

function toggleGrupo(g) { gruposAbertos[g] = !gruposAbertos[g]; renderizarCategorias(); }
function renderizarCategorias() {
  const busca = document.getElementById('busca-prestador').value.toLowerCase().trim();
  const container = document.getElementById('lista-categorias'); container.innerHTML = '';
  const grupos = {}; categorias.forEach(c => { if(!grupos[c.grupo]) grupos[c.grupo]=[]; grupos[c.grupo].push(c); });
  ['Obras e Reformas','Saúde e Home Care','Beleza e Bem-Estar','Assistência Técnica e Instalações','Alimentação e Entregas','Casa e Limpeza','Família e Área Externa','Educação e Idiomas','Pets e Animais','Outros'].forEach(grupo => {
    if(!grupos[grupo]) return;
    const cats = grupos[grupo].filter(c => !busca || c.nome.toLowerCase().includes(busca) || prestadores.some(p => p.categoria_principal_id===c.id && p.nome.toLowerCase().includes(busca)));
    if(cats.length===0) return;
    const aberto = gruposAbertos[grupo] || busca.length > 0;
    const div = document.createElement('div');
    div.innerHTML = `<div class="grupo-header ${getClasseGrupo(grupo)} ${!aberto?'collapsed':''}" onclick="toggleGrupo('${grupo}')"><span>${grupo}</span><span class="seta">▼</span></div><div class="grupo-content ${!aberto?'collapsed':''}">${cats.map(c => `<div class="card-categoria" style="border-left-color:${getCorGrupo(grupo)};" onclick="abrirCategoria(${c.id},'${c.nome.replace(/'/g,"\\'")}')"><div class="icone" style="background:${getCorGrupo(grupo)}20;color:${getCorGrupo(grupo)};">${getIcone(c.nome)}</div><div class="info"><div class="nome">${c.nome}</div><div class="contador">${prestadores.filter(p=>p.categoria_principal_id===c.id).length} prestador(es)</div></div><span style="color:#cbd5e0;font-size:20px;">›</span></div>`).join('')}</div>`;
    container.appendChild(div);
  });
}
function filtrarCategorias() { renderizarCategorias(); }

function abrirCategoria(id, nome) {
  categoriaAtualId = id; categoriaAtualNome = nome;
  document.getElementById('titulo-categoria-atual').textContent = nome;
  const lista = document.getElementById('lista-prestadores-categoria');
  const p = prestadores.filter(x => x.categoria_principal_id === id);
  lista.innerHTML = p.length === 0 ? '<div class="card-detalhe" style="text-align:center;color:#718096;padding:30px;">Nenhum prestador.</div>' : p.map(pr => {
    const r = resumoAvaliacoes[pr.id]||{indica:0,nao_indica:0}; const t = r.indica+r.nao_indica;
    return `<div class="card-prestador" onclick="abrirDetalhe(${pr.id})"><div class="info"><div class="nome">${pr.nome}</div><div class="sub">${pr.tipo} · ${pr.categoria_nome}</div></div><div style="text-align:right;"><div style="font-size:12px;color:#718096;">${t===0?'sem avaliação':r.indica+' indica'}</div></div></div>`;

  showTab('lista-prestadores');
}

function selecionarAvaliacao(t) { tipoAvaliacao=t; document.getElementById('btn-indica').classList.toggle('selected-indica',t==='indica'); document.getElementById('btn-nao-indica').classList.toggle('selected-nao',t==='nao_indica'); const sm=document.getElementById('secao-motivos'); const sc=document.getElementById('secao-comentario'); if(sm)sm.classList.toggle('hidden',t!=='indica'); if(sc)sc.classList.toggle('hidden',t!=='indica'); }
function toggleChip(el) { el.classList.toggle('selected'); }

// ✅ CORREÇÃO: recebe flag isSaude
async function enviarAvaliacao(isSaude = false) {
  if(!tipoAvaliacao) return alert('Selecione INDICA ou NÃO INDICA');
  const motivos = []; 
  const chips = document.querySelectorAll('#secao-motivos .chip.selected');
  chips.forEach(c=>motivos.push(c.textContent));
  const comentarioEl = document.getElementById('comentario');
  const comentario = comentarioEl ? comentarioEl.value : '';
  
  const res = await fetch('/api/avaliacoes', { method:'POST', headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}, body:JSON.stringify({prestador_id:prestadorAtual.id,tipo:tipoAvaliacao,motivos,comentario,is_saude:isSaude}) });
  if(res.ok) { alert('Avaliação enviada!'); await carregarResumoAvaliacoes(); abrirDetalhe(prestadorAtual.id); } else alert((await res.json()).error);
}

function voltarParaLista() { if(categoriaAtualId) abrirCategoria(categoriaAtualId,categoriaAtualNome); else showTab('home'); }

function showTab(tab) {
  ['home','lista-prestadores','detalhe-prestador','avaliacoes','precos','perfil','admin'].forEach(t=>{const e=document.getElementById('tab-'+t);if(e)e.classList.add('hidden');});
  document.getElementById('tab-'+tab).classList.remove('hidden');
  ['home','precos','avaliacoes','perfil'].forEach(t=>{const n=document.getElementById('nav-'+t);if(n)n.classList.remove('active');});
  const a=document.getElementById('nav-'+tab); if(a)a.classList.add('active');
  document.getElementById('bottom-nav').classList.toggle('hidden', tab==='admin'||tab==='lista-prestadores'||tab==='detalhe-prestador');
  if(tab==='avaliacoes') carregarMinhasAvaliacoes();
  if(tab==='perfil') carregarPerfil();
  if(tab==='admin') { carregarMoradores(); carregarCategoriasAdmin(); carregarMensagens(); }
  if(tab==='precos') preencherSelectGrafico();
}
function showAdminTab(tab) { ['moradores','categorias','mensagens'].forEach(t=>{document.getElementById('admin-'+t).classList.add('hidden');document.getElementById('admin-tab-'+t).classList.remove('active');}); document.getElementById('admin-'+tab).classList.remove('hidden'); document.getElementById('admin-tab-'+tab).classList.add('active'); }

async function salvarNovaCategoria() { const n=document.getElementById('nova-cat-nome').value.trim(); const g=document.getElementById('nova-cat-grupo').value; if(!n) return alert('Digite o nome'); await fetch('/api/admin/categorias',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({nome:n,grupo:g})}); alert('Criada!'); await carregarCategorias(); carregarCategoriasAdmin(); document.getElementById('nova-cat-nome').value=''; }
async function carregarMensagens() { const r=await fetch('/api/admin/mensagens',{headers:{'Authorization':`Bearer ${token}`}}); const m=await r.json(); document.getElementById('admin-mensagens').innerHTML=m.length===0?'<p style="text-align:center;color:#718096;padding:20px;">Nenhuma mensagem.</p>':m.map(x=>`<div class="card-detalhe"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="background:#f0fdfa;padding:3px 10px;border-radius:12px;font-size:11px;color:var(--teal-dark);font-weight:700;">${x.tipo}</span><span style="font-size:11px;color:#718096;">${new Date(x.created_at).toLocaleDateString('pt-BR')}</span></div><p style="font-size:14px;margin-bottom:8px;">${x.mensagem}</p><p style="font-size:12px;color:#718096;">De: ${x.morador_nome||'Desconhecido'} (Unidade ${x.unidade||'---'})</p></div>`).join(''); }
async function carregarMinhasAvaliacoes() { const r=await fetch('/api/morador/avaliacoes',{headers:{'Authorization':`Bearer ${token}`}}); const a=await r.json(); document.getElementById('lista-minhas-avaliacoes').innerHTML=a.length===0?'<div class="card-detalhe" style="text-align:center;color:#718096;padding:30px;">Nenhuma avaliação.</div>':a.map(x=>`<div class="card-detalhe"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div style="font-weight:700;">${x.prestador_nome}</div><span style="background:${x.tipo==='indica'?'#f0fdfa':'#fff5f3'};color:${x.tipo==='indica'?'var(--teal-dark)':'var(--coral-dark)'};padding:4px 12px;border-radius:14px;font-size:12px;font-weight:700;">${x.tipo==='indica'?'😊 INDICA':'😠 NÃO INDICA'}</span></div>${x.comentario?`<p style="font-size:13px;color:#718096;font-style:italic;">"${x.comentario}"</p>`:''}</div>`).join(''); }
async function carregarPerfil() { const r=await fetch('/api/morador/perfil',{headers:{'Authorization':`Bearer ${token}`}}); const p=await r.json(); document.getElementById('perfil-info').innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;"><div style="display:flex;justify-content:space-between;"><span style="color:#718096;">Nome:</span><span style="font-weight:700;">${p.nome||'---'}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:#718096;">Unidade:</span><span style="font-weight:700;">${p.unidade||'---'}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:#718096;">Telefone:</span><span style="font-weight:700;">${p.telefone}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:#718096;">Tipo:</span><span style="font-weight:700;">${p.eh_admin?'Administrador':'Morador'}</span></div></div>`; }

function abrirModalCadastro() { document.getElementById('modal-cadastro').classList.remove('hidden'); }
function fecharModalCadastro() { document.getElementById('modal-cadastro').classList.add('hidden'); }
async function salvarPrestador() {
  const n=document.getElementById('cad-nome').value.trim(), t=document.getElementById('cad-telefone').value.trim(), ti=document.getElementById('cad-tipo').value, c=document.getElementById('cad-categoria').value, d=document.getElementById('cad-diferencial').value.trim();
  if(!n||!t||!c) return alert('Preencha nome, telefone e categoria');
  const r=await fetch('/api/prestadores',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({nome:n,telefone:t,tipo:ti,categoria_id:c,diferencial:d})});
  if(r.ok) { alert('Cadastrado!'); fecharModalCadastro(); await carregarPrestadores(); renderizarCategorias(); } else alert((await r.json()).error);
}

function abrirModalEdicao(id) {
  const p=prestadores.find(x=>x.id===id); if(!p) return;
  const ehAdminReal = ehAdmin === true || (user && user.eh_admin === true);
  if(!ehAdminReal && (!user || p.cadastrado_por_morador_id !== user.id)) return alert('Sem permissão');
  prestadorEditandoId=id;
  document.getElementById('edit-nome').value=p.nome||''; document.getElementById('edit-telefone').value=p.telefone||''; document.getElementById('edit-tipo').value=p.tipo||'Morador'; document.getElementById('edit-diferencial').value=p.diferencial||'';
  const s=document.getElementById('edit-categoria'); s.innerHTML='<option value="">Selecione...</option>'; categorias.forEach(c=>s.innerHTML+=`<option value="${c.id}" ${c.id===p.categoria_principal_id?'selected':''}>${c.nome} (${c.grupo})</option>`);
  document.getElementById('modal-edicao').classList.remove('hidden');
}
function fecharModalEdicao() { document.getElementById('modal-edicao').classList.add('hidden'); prestadorEditandoId=null; }
async function salvarEdicaoPrestador() {
  if(!prestadorEditandoId) return;
  const n=document.getElementById('edit-nome').value.trim(), t=document.getElementById('edit-telefone').value.trim(), ti=document.getElementById('edit-tipo').value, c=document.getElementById('edit-categoria').value, d=document.getElementById('edit-diferencial').value.trim();
  if(!n||!t||!c) return alert('Preencha tudo');
  const r=await fetch(`/api/prestadores/${prestadorEditandoId}`,{method:'PATCH',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({nome:n,telefone:t,tipo:ti,categoria_id:c,diferencial:d})});
  if(r.ok) { alert('Atualizado!'); fecharModalEdicao(); await carregarPrestadores(); renderizarCategorias(); abrirDetalhe(prestadorEditandoId); } else alert((await r.json()).error);
}

async function salvarPrecoPrestador(id) {
  let t=document.getElementById('preco-tipo').value.trim(), v=document.getElementById('preco-valor').value;
  if(t==='Outros') { t=document.getElementById('preco-tipo-outros').value.trim(); if(!t) return alert('Digite o tipo'); }
  if(!v) return alert('Preencha o valor');
  const r=await fetch(`/api/prestadores/${id}/precos`,{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({tipo_preco:t,valor:v,data_referencia:new Date().toISOString().split('T')[0]})});
  if(r.ok) { alert('Preço adicionado!'); abrirDetalhe(id); } else alert('Erro');
}
function toggleOutrosPreco() { const s=document.getElementById('preco-tipo'), c=document.getElementById('preco-tipo-outros'); if(s.value==='Outros'){c.classList.remove('hidden');c.focus();}else{c.classList.add('hidden');c.value='';} }

function abrirModalEdicaoPreco(id, tipo, valor) {
  precoEditandoId = id;
  prestadorPrecoAtualId = prestadorAtual.id;
  document.getElementById('edit-preco-tipo').value = tipo;
  document.getElementById('edit-preco-valor').value = valor;
  document.getElementById('modal-edicao-preco').classList.remove('hidden');
}
function fecharModalEdicaoPreco() { document.getElementById('modal-edicao-preco').classList.add('hidden'); precoEditandoId = null; }
async function confirmarEdicaoPreco() {
  const t = document.getElementById('edit-preco-tipo').value;
  const v = document.getElementById('edit-preco-valor').value;
  if(!v) return alert('Valor inválido');
  const r = await fetch(`/api/precos/${precoEditandoId}`, { method:'PATCH', headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'}, body:JSON.stringify({tipo_preco:t, valor:v}) });
  if(r.ok) { alert('Preço atualizado!'); fecharModalEdicaoPreco(); abrirDetalhe(prestadorPrecoAtualId); } else alert((await r.json()).error);
}
async function deletarPreco(id) {
  if(!confirm('Tem certeza que deseja apagar este preço?')) return;
  const r = await fetch(`/api/precos/${id}`, { method:'DELETE', headers:{'Authorization':`Bearer ${token}`} });
  if(r.ok) { alert('Preço apagado!'); abrirDetalhe(prestadorAtual.id); } else alert((await r.json()).error);
}

function preencherSelectGrafico() { const s=document.getElementById('grafico-categoria-select'); s.innerHTML='<option value="">Selecione...</option>'; categorias.forEach(c=>s.innerHTML+=`<option value="${c.id}">${c.nome}</option>`); }
async function renderizarGraficoPrecos(id) {
  if(!id) return;
  const r=await fetch(`/api/categorias/${id}/precos`,{headers:{'Authorization':`Bearer ${token}`}}); const d=await r.json();
  const l=document.getElementById('lista-precos-categoria');
  if(d.length===0) { l.innerHTML='<p style="text-align:center;color:#718096;margin-top:20px;">Nenhum preço.</p>'; if(chartInstance){chartInstance.destroy();chartInstance=null;} return; }
  const tipos=[...new Set(d.map(x=>x.tipo_preco))];
  const ctx=document.getElementById('graficoPrecos').getContext('2d'); if(chartInstance)chartInstance.destroy();
  chartInstance=new Chart(ctx,{type:'bar',data:{labels:tipos,datasets:[{label:'Média (R$)',data:tipos.map(t=>(d.filter(x=>x.tipo_preco===t).reduce((a,b)=>a+parseFloat(b.valor||0),0)/d.filter(x=>x.tipo_preco===t).length).toFixed(2)),backgroundColor:'rgba(79,184,184,0.6)',borderRadius:8}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}});
  l.innerHTML='<h4 style="margin:20px 0 10px 0;font-weight:700;">Detalhamento:</h4>'+d.map(x=>`<div class="card-detalhe" style="padding:12px;display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:700;">${x.prestador_nome}</div><div style="font-size:12px;color:#718096;">${x.tipo_preco} · ${new Date(x.data_referencia).toLocaleDateString('pt-BR')}</div></div><div style="font-weight:800;color:var(--teal-dark);font-size:18px;">R$ ${parseFloat(x.valor).toFixed(2)}</div></div>`).join('');
}

function formatarTelefone(t) { let n=t.replace(/\D/g,''); if(n.startsWith('55')&&n.length>11)n=n.slice(2); if(n.length===11)return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`; if(n.length===10)return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`; return t; }
function extrairDadosWhatsApp() {
  const t=document.getElementById('whatsapp-paste').value; if(!t.trim()) return alert('Cole a mensagem');
  const m=t.match(/\(?\d{2}\)?\s?\d{4,5}-?\s?\d{4}/);
  if(m) { let n=m[0].replace(/\D/g,''); if(n.length===11)n=`(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`; else if(n.length===10)n=`(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`; document.getElementById('cad-telefone').value=n; }
  let cat=null; const tl=t.toLowerCase(); const p={'Eletricista':['eletricista','luz'],'Encanador':['encanador','cano'],'Pintor':['pintor'],'Diarista':['diarista','faxina'],'Ar-condicionado':['ar condicionado'],'Jardineiro':['jardineiro'],'Marceneiro':['marceneiro'],'Dedetizador':['dedetização']};
  for(const[k,v]of Object.entries(p)) if(v.some(x=>tl.includes(x))){cat=k;break;}
  if(cat) { const s=document.getElementById('cad-categoria'); for(let i=0;i<s.options.length;i++) if(s.options[i].text.toLowerCase().includes(cat.toLowerCase())){s.selectedIndex=i;break;} }
  let st=t.replace(m?m[0]:'','').replace(/indicado|recomendo|contato|tel|telefone|whatsapp|zap|ótimo|otimo|bom|boa/gi,'').trim(); const nm=st.split(/[,;.]/)[0].trim().split(' ').slice(0,3).join(' '); if(nm.length>2) document.getElementById('cad-nome').value=nm.charAt(0).toUpperCase()+nm.slice(1);
  alert('✨ Dados extraídos!');
}
</script>
